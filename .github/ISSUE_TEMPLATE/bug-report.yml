name: Bug Report
description: 报告问题，帮助复现和修复 / Report a reproducible problem
title: "bug: "
labels: ["bug"]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 操作与实际结果 / Steps and actual result
      description: 从哪个入口操作，执行了什么，出现了什么？
      placeholder: |
        1. 打开……
        2. 编辑……
        3. 保存或发送后……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected result
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 应用与 Android 版本 / App and Android versions
      placeholder: 3.1.2-context.2 · Android 15
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Provider、模型与协议 / Provider, model and protocol
      description: 请求相关问题请填写，例如 Chat Completions、Responses、Anthropic、Google 或 Interactions。
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: 截图、日志或请求片段 / Screenshots, logs or request excerpts
      description: 可附最小复现；分享前去掉密钥和个人信息。
    validations:
      required: false
