name: Feature Request
description: 提出希望完成的使用场景 / Suggest a workflow or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 想完成什么 / Goal
      description: 描述你的目标，以及当前操作在哪一步受阻。
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: 期望的操作流程 / Proposed workflow
      description: 从哪里进入，编辑或选择什么，最后得到什么结果？
    validations:
      required: true
  - type: textarea
    id: examples
    attributes:
      label: 示例或补充 / Examples or context
    validations:
      required: false
